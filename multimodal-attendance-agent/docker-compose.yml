version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: multimodal_classroom_backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=multimodal-agent-secret-key-2026
      - FLASK_ENV=development
      - PORT=5000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.0-flash
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

  frontend-preview:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: multimodal_classroom_preview
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
